services:
  - type: web
    name: keoco-backend
    env: node
    plan: free
    rootDir: src/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WIN_SCORE
        value: 10
      - key: BUZZ_TIMEOUT_SEC
        value: 15
      - key: ANSWER_TIMEOUT_SEC
        value: 10
      - key: REBOUND_TIMEOUT_SEC
        value: 8
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
